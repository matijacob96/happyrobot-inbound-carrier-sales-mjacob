services:
  firestore-emulator:
    image: ghcr.io/ridedott/firestore-emulator:latest
    container_name: hr-firestore
    ports:
      - "8085:8080"
    environment:
      FIRESTORE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-happyrobot-fde-poc}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hr-api
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY:-dev-local-api-key-change-me}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-happyrobot-fde-poc}
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      FMCSA_API_KEY: ${FMCSA_API_KEY:-replace-me}
      FMCSA_BASE_URL: ${FMCSA_BASE_URL:-https://mobile.fmcsa.dot.gov/qc/services}
      FMCSA_MOCK: ${FMCSA_MOCK:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:4173}
    depends_on:
      - firestore-emulator

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: hr-dashboard
    ports:
      - "4173:8080"
    depends_on:
      - api
