services:
  firestore-emulator:
    image: ghcr.io/ridedott/firestore-emulator:latest
    container_name: hr-firestore
    ports:
      - "8085:8080"
    environment:
      FIRESTORE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-happyrobot-fde-poc}

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hr-api
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_KEY: ${API_KEY:-dev-local-api-key-change-me}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-happyrobot-fde-poc}
      FIRESTORE_EMULATOR_HOST: firestore-emulator:8080
      FMCSA_API_KEY: ${FMCSA_API_KEY:-replace-me}
      FMCSA_BASE_URL: ${FMCSA_BASE_URL:-https://mobile.fmcsa.dot.gov/qc/services}
      FMCSA_MOCK: ${FMCSA_MOCK:-true}
      # The dashboard reaches the API through its own nginx BFF (same-origin),
      # so CORS is not exercised in the normal browser flow. Keep loose locally
      # to allow direct curl/Postman testing.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      - firestore-emulator

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    container_name: hr-dashboard
    ports:
      - "4173:8080"
    environment:
      # The nginx BFF inside this container proxies /api/* to UPSTREAM_API and
      # injects the x-api-key header server-side. The browser never sees the key.
      UPSTREAM_API: http://api:8080
      API_KEY: ${API_KEY:-dev-local-api-key-change-me}
    depends_on:
      - api
